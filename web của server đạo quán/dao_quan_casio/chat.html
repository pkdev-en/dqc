<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat · Đạo Quán Casio</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#030303;--fg:#e2e8f0;--white:#fff;--gray:#888;--dark:#111;--font:'JetBrains Mono',monospace}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
nav{background:rgba(15,15,20,.6);color:var(--fg);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.06)}
.nav-logo{font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--fg)}
.nav-logo span{color:var(--gray)}
.nav-right{display:flex;gap:10px;align-items:center}
.nav-back{color:var(--gray);text-decoration:none;font-size:.55rem;letter-spacing:.12em;padding:4px 10px;border:1px solid rgba(255,255,255,.15);border-radius:3px;transition:all .3s}
.nav-back:hover{color:var(--white);border-color:var(--white)}
.nav-user{font-size:.55rem;opacity:.6;color:var(--gray)}
.btn-login{background:transparent;color:var(--fg);border:1px solid rgba(255,255,255,.2);padding:4px 12px;font-family:var(--font);font-size:.55rem;cursor:pointer;border-radius:3px;transition:all .3s}
.btn-login:hover{background:rgba(255,255,255,.08);border-color:var(--white)}
.chat-area{flex:1;display:flex;flex-direction:column;max-width:800px;margin:0 auto;width:100%;padding:12px 16px;overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:8px 0;display:flex;flex-direction:column;gap:6px}
.msg{display:flex;gap:8px;padding:6px 8px;border-radius:4px;transition:background .2s;align-items:flex-start}
.msg:hover{background:rgba(255,255,255,.03)}
.msg-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;background:#222}
.msg-body{flex:1;min-width:0}
.msg-head{display:flex;gap:8px;align-items:baseline;margin-bottom:2px}
.msg-author{font-size:.65rem;font-weight:700}
.msg-time{font-size:.5rem;opacity:.3}
.msg-text{font-size:.65rem;line-height:1.5;opacity:.9;word-break:break-word;white-space:pre-wrap}
.msg-source{font-size:.45rem;padding:1px 4px;border-radius:2px;background:#222;color:var(--gray);margin-left:4px}
.chat-input-area{display:flex;gap:8px;padding:10px 0;border-top:1px solid #222;flex-shrink:0}
.chat-input-area input{flex:1;background:var(--dark);border:1px solid #222;color:var(--white);padding:8px 12px;font-family:var(--font);font-size:.7rem;border-radius:4px;outline:none}
.chat-input-area input:focus{border-color:var(--gray)}
.chat-input-area input:disabled{opacity:.4}
.chat-input-area button{background:var(--white);color:var(--black);border:none;padding:8px 16px;font-family:var(--font);font-size:.65rem;font-weight:700;cursor:pointer;border-radius:4px;transition:all .3s}
.chat-input-area button:hover{background:var(--gray)}
.chat-input-area button:disabled{opacity:.3;cursor:not-allowed}
.chat-status{font-size:.5rem;color:var(--gray);text-align:center;padding:4px;flex-shrink:0;opacity:.6}
.empty-chat{flex:1;display:flex;align-items:center;justify-content:center;font-size:.6rem;color:var(--gray)}
@media(max-width:600px){.chat-area{padding:6px 8px}}
</style>
</head>
<body>

<nav>
  <div class="nav-logo"><span>✦</span> #chat-chung</div>
  <div class="nav-right">
    <span class="nav-user" id="userDisplay">Offline</span>
    <button class="btn-login" id="loginBtn">Login Discord</button>
    <a class="nav-back" href="/">← Back</a>
  </div>
</nav>

<div class="chat-area">
  <div class="chat-msgs" id="chatBox">
    <div class="empty-chat">⏳ Đang tải tin nhắn...</div>
  </div>
  <div class="chat-status" id="chatStatus">Kết nối...</div>
  <div class="chat-input-area">
    <input type="text" id="chatInput" placeholder="Yêu cầu Login Discord để nhắn tin..." disabled>
    <button id="sendBtn" disabled>Gửi</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA3T9kqb47wdCbikzU60v1e2FBOaFD-l4g",
  authDomain: "daoquancasio-eaf37.firebaseapp.com",
  projectId: "daoquancasio-eaf37",
  storageBucket: "daoquancasio-eaf37.firebasestorage.app",
  messagingSenderId: "81639896565",
  appId: "1:81639896565:web:f00db033997ea4b34b1cbc"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const fdb = firebase.firestore();
auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

const chatBox = document.getElementById('chatBox');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const loginBtn = document.getElementById('loginBtn');
const userDisplay = document.getElementById('userDisplay');
const chatStatus = document.getElementById('chatStatus');

let user = null;
let unsubscribe = null;

auth.onAuthStateChanged(u => {
  user = u;
  if (u) {
    const name = u.displayName || u.email || u.uid;
    userDisplay.textContent = `${name}`;
    loginBtn.textContent = 'Logout';
    chatInput.disabled = false;
    chatInput.placeholder = 'Nhập tin nhắn...';
    sendBtn.disabled = false;
  } else {
    userDisplay.textContent = 'Offline';
    loginBtn.textContent = 'Login Discord';
    chatInput.disabled = true;
    chatInput.placeholder = 'Yêu cầu Login Discord để nhắn tin...';
    sendBtn.disabled = true;
  }
});

loginBtn.addEventListener('click', () => {
  if (user) { auth.signOut(); return; }
  window.location.href = '/auth/discord';
});

sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

async function sendMessage() {
  if (!user || !chatInput.value.trim()) return;
  const text = chatInput.value.trim();
  chatInput.value = '';
  try {
    await fetch('/api/chat/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        token: await user.getIdToken(),
        text: text
      })
    });
  } catch(e) {
    chatStatus.textContent = '❌ Lỗi gửi tin nhắn';
  }
}

function renderMsg(doc) {
  const d = doc.data();
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = `
    <img class="msg-avatar" src="${d.avatar || ''}" alt="" onerror="this.style.display='none'">
    <div class="msg-body">
      <div class="msg-head">
        <span class="msg-author">${escHtml(d.author||'Unknown')}</span>
        <span class="msg-time">${d.timestamp ? new Date(d.timestamp.seconds*1000).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}) : ''}</span>
        <span class="msg-source">${d.source||'web'}</span>
      </div>
      <div class="msg-text">${escHtml(d.text)}</div>
    </div>`;
  return div;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

unsubscribe = fdb.collection('messages')
  .orderBy('timestamp', 'asc')
  .limit(100)
  .onSnapshot(snapshot => {
    chatBox.innerHTML = '';
    if (snapshot.empty) {
      chatBox.innerHTML = '<div class="empty-chat">Chưa có tin nhắn. Hãy là người đầu tiên!</div>';
    } else {
      snapshot.forEach(doc => chatBox.appendChild(renderMsg(doc)));
    }
    chatBox.scrollTop = chatBox.scrollHeight;
    chatStatus.textContent = `✓ ${snapshot.size} tin nhắn`;
  }, err => {
    chatStatus.textContent = '⚠ Lỗi kết nối Firestore';
  });
</script>
</body>
</html>
