<!DOCTYPE html>

<title>HD Compiler 580 · Đạo Quán Casio</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#030303;--fg:#e2e8f0;--white:#fff;--gray:#888;--card-bg:rgba(15,15,20,.4);--dark:#111;--font:'JetBrains Mono',monospace;--font2:'Cinzel Decorative',serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
nav{position:fixed;top:0;left:0;right:0;background:rgba(15,15,20,.6);color:var(--fg);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.06)}
.nav-logo{font-family:var(--font2);font-size:.65rem;letter-spacing:.2em;color:var(--fg)}
.nav-logo span{color:var(--gray)}
.nav-back{color:var(--gray);text-decoration:none;font-size:.55rem;letter-spacing:.12em;padding:4px 10px;border:1px solid rgba(255,255,255,.15);border-radius:3px;transition:all .3s}
.nav-back:hover{color:var(--white);border-color:var(--white)}
.box{text-align:center;max-width:480px;padding:24px}
.box-icon{font-size:2rem;margin-bottom:12px;opacity:.5}
.box h2{font-family:var(--font2);font-size:.95rem;letter-spacing:.12em;margin-bottom:8px;color:var(--fg)}
.box p{font-size:.6rem;line-height:1.7;color:var(--gray);margin-bottom:16px}
.box code{background:var(--dark);padding:2px 8px;border-radius:3px;font-size:.55rem;color:var(--white)}
.box .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:#5865f2;color:#fff;border:none;border-radius:4px;text-decoration:none;font-family:var(--font);font-size:.6rem;letter-spacing:.08em;transition:opacity .2s}
.box .btn:hover{opacity:.85}
</style>
</head>
