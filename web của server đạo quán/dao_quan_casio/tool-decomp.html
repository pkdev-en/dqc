<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROP Decompiler · SH-3</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700;800&family=Cinzel+Decorative:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#030303;--fg:#e2e8f0;--white:#fff;--gray:#888;--card-bg:rgba(15,15,20,.4);--dark:#111;--font:'JetBrains Mono',monospace;--font2:'Cinzel Decorative',serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--fg);min-height:100vh;display:flex;flex-direction:column}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:var(--black)}
::-webkit-scrollbar-thumb{background:#333;border-radius:2px}
nav{background:rgba(15,15,20,.6);color:var(--fg);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.06)}
.nav-logo{font-family:var(--font2);font-size:.65rem;letter-spacing:.2em;color:var(--fg)}
.nav-logo span{color:var(--gray)}
.nav-back{color:var(--gray);text-decoration:none;font-size:.55rem;letter-spacing:.12em;padding:4px 10px;border:1px solid rgba(255,255,255,.15);border-radius:3px;transition:all .3s}
.nav-back:hover{color:var(--white);border-color:var(--white)}
.hero{padding:50px 24px 30px;text-align:center;border-bottom:1px solid rgba(255,255,255,.06)}
.hero-title{font-family:var(--font2);font-size:1.1rem;letter-spacing:.12em;margin-bottom:4px;color:var(--fg)}
.hero-sub{font-size:.55rem;letter-spacing:.2em;opacity:.5;text-transform:uppercase}
.tool-area{flex:1;padding:24px;max-width:900px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:16px}
.input-group{display:flex;flex-direction:column;gap:6px}
.input-group label{font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;opacity:.4;color:var(--gray)}
textarea{width:100%;min-height:120px;background:var(--dark);color:#0f0;border:1px solid #222;border-radius:6px;padding:12px;font-family:var(--font);font-size:.75rem;line-height:1.5;resize:vertical;outline:none}
textarea:focus{border-color:rgba(255,255,255,.3)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:transparent;color:var(--fg);border:1px solid rgba(255,255,255,.2);padding:8px 18px;font-family:var(--font);font-size:.65rem;letter-spacing:.1em;cursor:pointer;border-radius:4px;transition:all .3s;font-weight:700}
.btn:hover{background:rgba(255,255,255,.08);border-color:var(--white)}
.btn-dark{background:rgba(255,255,255,.05);color:var(--gray);border:1px solid rgba(255,255,255,.1)}
.btn-dark:hover{background:rgba(255,255,255,.1);border-color:var(--gray)}
.output-area{background:var(--dark);border:1px solid rgba(255,255,255,.08);border-radius:6px;padding:12px;min-height:200px;font-family:var(--font);font-size:.7rem;line-height:1.6;white-space:pre-wrap;color:#0f0;overflow:auto}
.stats{font-size:.55rem;color:var(--gray);margin-top:4px;opacity:.6}
.asm-line{transition:background .15s;padding:0 4px;border-radius:2px}
.asm-line:hover{background:rgba(255,255,255,.05)}
.asm-addr{color:var(--gray)}
.asm-opcode{color:#0f0}
.asm-gadget{color:#0ff}
.asm-comment{color:#555;font-style:italic}
@media(max-width:600px){.tool-area{padding:16px}}
</style>
</head>
<body>

<nav>
  <div class="nav-logo"><span>✦</span> ROP Decompiler</div>
  <a class="nav-back" href="/">← Back</a>
</nav>

<div class="hero">
  <div class="hero-title">⚡ ROP Decompiler</div>
  <div class="hero-sub">Hex → Assembly SH-3 / nX-U16</div>
</div>

<div class="tool-area">
  <div class="input-group">
    <label>Hex Input</label>
    <textarea id="hexInput" placeholder="Dán hex vào đây...&#10;VD: FD 24 30 30 0D 24 30 30&#10;hoặc: FD2430300D243030"></textarea>
  </div>
  <div class="btn-row">
    <button class="btn" onclick="decompile()">▶ Decompile</button>
    <button class="btn btn-dark" onclick="clearAll()">✕ Clear</button>
    <span class="stats" id="stats"></span>
  </div>
  <label style="font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;opacity:.6;margin-top:8px">Output</label>
  <div class="output-area" id="output">Nhập hex và nhấn "Decompile"...</div>
</div>

  0xDDD4:"screen_buffer",0xD137:"font_size",0xD113:"cursor_noflash",
  0xDBD0:"magic_string"
};

function hexToBytes(h) {
  let c = h.replace(/[^0-9a-fA-F]/g,'');
  if (!c) return [];
  if (c.length % 2) c = c.slice(0,-1);
  let r = [];
  for (let i = 0; i < c.length; i+=2) r.push(parseInt(c.substr(i,2),16));
  return r;
}

function normalizeAddr(addr) {
  if (addr === 0x09c21) return 0x09c20;
  if (addr === 0x0947e) return 0x0947c;
  if ((addr & 1) && GADGET_MAP[addr-1]) return addr - 1;
  return addr;
}

function findGadget(addr) {
  let a = normalizeAddr(addr);
  let name = GADGET_MAP[a];
  if (name) return { addr: a, name };
  // try nearby
  for (let i = 1; i <= 8; i++) {
    if (GADGET_MAP[addr - i]) return { addr: addr - i, name: GADGET_MAP[addr - i], offset: i };
  }
  return null;
}

function formatAsm(bytes, startAddr) {
  let out = [], i = 0, addr = startAddr || 0xD730;
  while (i < bytes.length) {
    let g = findGadget(addr);
    if (g && !g.offset) {
      let name = g.name;
      let size = 4;
      if (name.startsWith("hex ") || name.match(/^BL /)) size = 4;
      else if (name.startsWith("pop ") && !name.includes(",")) size = 2;
      else if (name === "nop" || name === "rt" || name === "brk") size = 2;
      out.push(`  ${addr.toString(16).padStart(5,'0')}  ${name}`);
      i += size;
      addr += size;
    } else {
      let b = bytes[i];
      let name = VALUE_TO_NAME[b];
      if (name) {
        out.push(`  ${addr.toString(16).padStart(5,'0')}  ${name}`);
        i += 1;
        addr += 1;
      } else {
        let hexW = bytes.slice(i,i+4);
        let hexStr = hexW.map(b=>b.toString(16).padStart(2,'0')).join(' ');
        if (hexW.length >= 4) {
          let w = (hexW[0]|hexW[1]<<8); // little endian
          out.push(`  ${addr.toString(16).padStart(5,'0')}  ${hexStr}  ; data/addr`);
          i += 4; addr += 4;
        } else if (hexW.length >= 2) {
          let w = (hexW[0]|hexW[1]<<8);
          let valName = VALUE_TO_NAME[w];
          if (valName) {
            out.push(`  ${addr.toString(16).padStart(5,'0')}  ${valName}`);
            i += 2; addr += 2;
          } else {
            out.push(`  ${addr.toString(16).padStart(5,'0')}  ${hexStr}`);
            i += hexW.length; addr += hexW.length;
          }
        } else {
          out.push(`  ${addr.toString(16).padStart(5,'0')}  ${b.toString(16).padStart(2,'0')}`);
          i += 1; addr += 1;
        }
      }
    }
  }
  return out.join('\n');
}

function decompile() {
  let input = document.getElementById('hexInput').value.trim();
  if (!input) { document.getElementById('output').textContent = '❌ Nhập hex cần decompile.'; return; }
  let bytes = hexToBytes(input);
  if (!bytes.length) { document.getElementById('output').textContent = '❌ Hex không hợp lệ.'; return; }
  let asm = formatAsm(bytes);
  document.getElementById('output').textContent = asm;
  document.getElementById('stats').textContent = `${bytes.length} bytes · ${asm.split('\n').filter(l=>l.trim()).length} instructions`;
}

function clearAll() {
  document.getElementById('hexInput').value = '';
  document.getElementById('output').textContent = 'Nhập hex và nhấn "Decompile"...';
  document.getElementById('stats').textContent = '';
}

document.getElementById('hexInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) decompile();
});
</script>
